name: AutoJuben CMM Quality Gates
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'api/**'
      - 'scripts/**'
      - 'sql/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'api/**'
      - 'scripts/**'
      - 'sql/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b163ceaaa4a8d0e9d434f3a2c78 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require project source
        run: test -f apps/api/package.json && test -f apps/web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: CMM protected modules
        run: npm run check:protected
      - name: Architecture and API contracts
        run: npm run quality
      - name: TypeScript strict checks
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production frontend build
        run: npm run build:web
